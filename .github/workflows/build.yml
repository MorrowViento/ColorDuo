name: Build ColorDuo

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 37
        run: |
          SDK="$RUNNER_TEMP/colorduo-android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl --fail --silent --show-error --location \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip \
            --output "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            --install "platforms;android-37.0" "build-tools;37.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: ColorOS ownership and signal tests
        run: sh tests/coloros-policy.sh
      - name: Upstream behavior parity
        run: python3 tests/upstream-parity.py
      - name: Ring rendering and settings tests
        run: sh tests/coloros-settings.sh
      - name: Battery units and upstream power rendering
        run: python3 tests/coloros-power.py
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Collect
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ColorDuo-0.1.0-alpha4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ColorDuo-0.1.0-alpha4
          path: dist/*.apk
          if-no-files-found: error
