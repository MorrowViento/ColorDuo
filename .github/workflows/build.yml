name: Build ColorDuo

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: ColorOS ownership and signal tests
        run: sh tests/coloros-policy.sh
      - name: Ring rendering and settings tests
        run: sh tests/coloros-settings.sh
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Collect
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ColorDuo-0.1.0-alpha1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ColorDuo-0.1.0-alpha1
          path: dist/*.apk
          if-no-files-found: error
